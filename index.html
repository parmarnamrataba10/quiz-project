<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quizz</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div
      class="container d-flex justify-content-center align-items-center min-vh-100"
    >
      <div class="row quiz-card rounded-5 shadow-lg ">
        <div class="card d-flex flex-column gap-4">
          <div class="card-body">
            <h1 class="card-title text-center text-success">Quiz</h1>
            <div class="d-flex justify-content-between mt-5">
              <h4 class="text-primary" id="qnsNum">Qns 1/3</h4>
              <h4 class="text-danger" id="timer">Time Left 30</h4>
            </div>

            <h2 class="text-center m-4" id="qns">Question will appear here</h2>
            <div class="row" id="options"></div>

            <button
              class="btn  w-100 mt-5 align-items-center"
              id="nextbtn"
              onclick="nextQns()"
            >
              Next Question
            </button>

            <h3 id="result"></h3>
          </div>
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="./script.js"></script>
  </body>
</html>
